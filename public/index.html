<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Tus series y películas: qué sigue, cuándo sale y dónde verlo." />

    <!-- Instalable como app (computador, Android e iPhone). __BASE__ lo completa scripts/build-web.mjs. -->
    <link rel="manifest" href="__BASE__/manifest.json" />
    <meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="__BASE__/favicon.png" />
    <link rel="apple-touch-icon" href="__BASE__/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sollar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Barra de la hora del iPhone según el tema guardado: blanca con letras negras en modo
      // claro, negra con letras blancas en modo oscuro. Así no aparece el difuminado de iOS 26
      // encima del contenido ni se mezclan los modos.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('sollar.theme.v2') || 'null');
          var old = JSON.parse(localStorage.getItem('sollar.theme.v1') || '{}');
          if (!saved) saved = { mode: old.mode };
          var mode = saved.mode || 'light';
          if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = mode === 'dark' ? 'black-translucent' : 'default';
          document.documentElement.style.background = mode === 'dark' ? '#0b0b0d' : '#f6f6f7';
          // Ícono de la app con el color elegido (se usa al agregarla a la pantalla de inicio).
          var accent = saved.accent || 'sol';
          if (['sol', 'brasa', 'atardecer', 'cereza'].indexOf(accent) >= 0) {
            document.querySelector('link[rel="apple-touch-icon"]').href = '__BASE__/icons/' + accent + '-apple-touch-icon.png';
            document.querySelector('link[rel="manifest"]').href = '__BASE__/manifest-' + accent + '.json';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Estilos base recomendados por react-native-web. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #f6f6f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0b0d;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Sollar necesita JavaScript activado.</noscript>
    <div id="root"></div>
  </body>
</html>
