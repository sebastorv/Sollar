<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Tus series y películas: qué sigue, cuándo sale y dónde verlo." />

    <!-- Instalable como app (computador, Android e iPhone). __BASE__ lo completa scripts/build-web.mjs. -->
    <link rel="manifest" href="__BASE__/manifest.json" />
    <meta name="theme-color" content="#F7F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0D12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="__BASE__/favicon.png" />
    <link rel="apple-touch-icon" href="__BASE__/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sollar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Estilos base recomendados por react-native-web. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #f7f6f9;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e0d12;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Sollar necesita JavaScript activado.</noscript>
    <div id="root"></div>
  </body>
</html>
