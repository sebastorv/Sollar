<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Tus series y películas: qué sigue, cuándo sale y dónde verlo." />

    <!-- Instalable como app (computador, Android e iPhone). __BASE__ lo completa scripts/build-web.mjs. -->
    <link rel="manifest" href="__BASE__/manifest.json" />
    <meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="__BASE__/favicon.png" />
    <link rel="apple-touch-icon" href="__BASE__/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sollar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Estilos base recomendados por react-native-web. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #f6f6f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0b0d;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* App de la pantalla de inicio: ocupa toda la pantalla, también detrás de la hora y del
         indicador de inicio, sin franja vacía abajo. */
      @media (display-mode: standalone) {
        html,
        body {
          height: 100lvh;
        }
        #root {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: 100lvh;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Sollar necesita JavaScript activado.</noscript>
    <div id="root"></div>
  </body>
</html>
